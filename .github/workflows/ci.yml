name: CI

on:
  # Branch pushes are covered by the pull_request event once a PR is
  # open; limiting push to the default branch avoids running every job
  # twice on the same commit.
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dir: trading_webapp/backend
            tests: tests
          - name: grid_optimizer
            dir: grid_optimizer
            tests: tests
          - name: eval_agent
            dir: eval_agent
            tests: tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.dir }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.dir }}
        # No API keys and no network are provided: the suites must pass
        # offline, which is what keeps them deterministic.
        run: python -m pytest ${{ matrix.tests }} -q

  safety-defaults:
    name: safety defaults
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: trading_webapp/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Assert a fresh checkout cannot place a live order
        working-directory: trading_webapp/backend
        # Guards the property the whole design rests on. If a future
        # change flips a default, this fails before it reaches anyone.
        run: |
          python - <<'PY'
          import sys
          from app.config import Settings

          s = Settings()
          problems = []
          if s.broker != "paper":
              problems.append(f"default broker is {s.broker!r}, expected 'paper'")
          if s.allow_live:
              problems.append("allow_live defaults to True")
          if s.live_enabled:
              problems.append("live_enabled is True on a default config")

          # The same must hold for a real broker without the master switch.
          live = Settings(broker="metaapi")
          if live.live_enabled:
              problems.append("metaapi is live without XAU_ALLOW_LIVE")

          if problems:
              print("SAFETY DEFAULTS VIOLATED:")
              for p in problems:
                  print("  -", p)
              sys.exit(1)
          print("OK: defaults are paper-only and live trading requires an explicit opt-in")
          PY

      - name: Assert the EA ships in dry run
        run: |
          if grep -qE '^input\s+bool\s+InpDryRun\s*=\s*true;' trading_webapp/mt5_ea/XAUUSD_Bridge_EA.mq5; then
            echo "OK: EA defaults to dry run"
          else
            echo "EA does not default to InpDryRun = true"
            exit 1
          fi

      - name: Assert no .env file is committed
        run: |
          if git ls-files --error-unmatch '*.env' >/dev/null 2>&1; then
            echo "a .env file is tracked — secrets must stay out of the repo"
            exit 1
          fi
          echo "OK: no .env tracked"
