name: Python XAUUSD 1Y Backtest

on:
  push:
    branches:
      - research/python-xau-backtest-20260916
    paths:
      - "research/python_xau_backtest/**"
      - ".github/workflows/python-xau-backtest.yml"
  workflow_dispatch:

jobs:
  utbot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sanity-check Dukascopy XAUUSD M5
        run: |
          mkdir -p research/python_xau_backtest/data
          npx -y dukascopy-node@1.50.0 \
            -i xauusd \
            -from 2025-09-16 \
            -to 2025-09-17 \
            -t m5 \
            -p bid \
            -f csv \
            -dir research/python_xau_backtest/data \
            -fn sanity \
            -r 3
          test -s research/python_xau_backtest/data/sanity.csv
          head -n 3 research/python_xau_backtest/data/sanity.csv
      - name: Download 1Y XAUUSD M5
        run: |
          rm -rf research/python_xau_backtest/data/parts
          npx -y dukascopy-node@1.50.0 \
            -i xauusd \
            -from 2025-09-16 \
            -to 2026-09-16 \
            -t m5 \
            -p bid \
            -f csv \
            -dir research/python_xau_backtest/data \
            -fn xauusd_m5 \
            -r 3
          test -s research/python_xau_backtest/data/xauusd_m5.csv
          ls -lh research/python_xau_backtest/data/xauusd_m5.csv
          head -n 2 research/python_xau_backtest/data/xauusd_m5.csv
      - name: Install
        run: pip install pandas numpy
      - name: Run UT Bot 1-year screen
        run: python research/python_xau_backtest/utbot_backtest.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: utbot-backtest-results
          path: research/python_xau_backtest/output/
