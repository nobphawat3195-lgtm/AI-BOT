name: Python XAUUSD 1Y Backtest

on:
  push:
    branches:
      - research/python-xau-backtest-20260916
    paths:
      - "research/python_xau_backtest/**"
      - ".github/workflows/python-xau-backtest.yml"
  workflow_dispatch:

jobs:
  utbot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download current MT5 XAUUSD M5 dataset
        run: |
          mkdir -p research/python_xau_backtest/data
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/simom1/XAUUSD-history/9b1f323866d0150ed2422c0e0cf1b97aa1bfcb22/Gold-Cash/XAUUSD/XAUUSD_M5.csv" \
            -o research/python_xau_backtest/data/xauusd_m5.csv
          test -s research/python_xau_backtest/data/xauusd_m5.csv
          ls -lh research/python_xau_backtest/data/xauusd_m5.csv
          head -n 2 research/python_xau_backtest/data/xauusd_m5.csv
      - name: Install
        run: pip install pandas numpy
      - name: Run UT Bot 1-year screen
        run: python research/python_xau_backtest/utbot_backtest.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: utbot-backtest-results
          path: research/python_xau_backtest/output/
