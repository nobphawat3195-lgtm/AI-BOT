name: Python XAUUSD UT Bot Final Stress Fast
on:
  push:
    branches: [research/python-xau-backtest-20260916]
    paths:
      - "research/python_xau_backtest/utbot_final_stress_fast.py"
      - ".github/workflows/python-xau-utbot-final-stress-fast.yml"
  workflow_dispatch:
jobs:
  stress-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Download pinned XAUUSD M5
        run: |
          mkdir -p research/python_xau_backtest/data
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/simom1/XAUUSD-history/9b1f323866d0150ed2422c0e0cf1b97aa1bfcb22/Gold-Cash/XAUUSD/XAUUSD_M5.csv" -o research/python_xau_backtest/data/xauusd_m5.csv
      - name: Install
        run: pip install pandas numpy
      - name: Run fast stress
        run: python research/python_xau_backtest/utbot_final_stress_fast.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: utbot-final-stress-fast-results
          path: research/python_xau_backtest/output/
